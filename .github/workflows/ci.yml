name: CI

on:
  push:
    branches: [ develop, master, 'feature/**' ]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only checks out, builds, tests and packs.
# Declaring the block sets every unlisted scope to 'none'.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Semiodesk.Trinity.sln

      - name: Build
        run: dotnet build Semiodesk.Trinity.sln -c Release --no-restore

      # Only the in-memory suites run in CI; the store-integration projects
      # (Virtuoso/Fuseki/GraphDB) need live servers and are excluded.
      - name: Test
        run: |
          dotnet test Trinity.Tests/Trinity.Tests.csproj -c Release --no-build
          dotnet test tests/Trinity.Generator.Tests/Trinity.Generator.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Trinity/Trinity.csproj -c Release --no-build --output ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
